services:
  # Backend API service
  - type: web
    name: retell-ai-backend
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RETELL_API_KEY
        sync: false  # Will be set in Render dashboard
      - key: RETELL_AGENT_ID
        sync: false  # Will be set in Render dashboard

  # Frontend React app
  - type: web
    name: retell-ai-frontend
    env: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/build
    envVars:
      - key: REACT_APP_BACKEND_URL
        value: https://retell-ai-backend.onrender.com
