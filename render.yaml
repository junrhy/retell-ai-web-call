services:
  # Combined Backend + Frontend service
  - type: web
    name: retell-ai-webcall
    env: node
    plan: free
    buildCommand: |
      cd backend && npm install
      cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: RETELL_API_KEY
        sync: false  # Will be set in Render dashboard
      - key: RETELL_AGENT_ID
        sync: false  # Will be set in Render dashboard
      - key: REACT_APP_BACKEND_URL
        value: https://retell-ai-webcall.onrender.com
